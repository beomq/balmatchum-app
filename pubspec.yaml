name: balmatchum_app
description: "Balmatchum mobile app bootstrap."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  balmatchum_client:
    git:
      url: https://github.com/beomq/balmatchum-server.git
      ref: 635c7e8b5ffd4373b0e10c98027fec39de1ddbd7
      path: client/
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: 14.1.1
  battery_plus: 7.1.2
  path_provider: 2.1.6
  go_router: ^18.0.1
  kakao_flutter_sdk_user: 2.0.1
  serverpod_auth_core_flutter: 4.0.3
  social_signin_kit: ^0.1.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/social/google.png
    - assets/social/apple.png
    - assets/social/kakao.png
    - assets/social/naver.png
