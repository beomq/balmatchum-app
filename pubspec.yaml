    - assets/wardrobe/items/beanie/pine/
    - assets/wardrobe/items/beanie/plum/
    - assets/wardrobe/items/beanie/tomato/
    - assets/wardrobe/items/booties/cut/
    - assets/wardrobe/items/booties/navy/
    - assets/wardrobe/items/booties/over/
    - assets/wardrobe/items/booties/pine/
    - assets/wardrobe/items/booties/plum/
    - assets/wardrobe/items/booties/tomato/
    - assets/wardrobe/items/gulle/bunhong/
    - assets/wardrobe/items/gulle/cut/
