name: balmatchum_app
description: "Balmatchum mobile app bootstrap."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  balmatchum_client:
    git:
      url: https://github.com/beomq/balmatchum-server.git
      ref: 05f3e2eed77b039f31ba09fab35d16f49cada807
      path: client/
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_auth_2: 5.1.0
  crypto: 3.0.7
  path_provider: 2.1.6
  image_picker: 1.2.4
  gal: 2.3.2
  share_plus: ^13.0.0
  go_router: ^18.0.1
  kakao_flutter_sdk_user: 2.0.1
  serverpod_auth_core_flutter: 4.0.3
  serverpod_auth_idp_flutter: 4.0.3
  serverpod_auth_idp_client: 4.0.3
  google_sign_in: 7.2.0
  google_mobile_ads: 9.1.0
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.4
  in_app_purchase_storekit: 0.4.14
  in_app_purchase_platform_interface: 1.4.0
  sign_in_with_apple: 8.2.0
  social_signin_kit: ^0.1.2
  world_holidays: ^2.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE-Pretendard.txt
    - assets/fonts/LICENSE-Galmuri.txt
    - assets/brand/balmatchum_splash.png
    - assets/first_meeting/
    - assets/first_meeting/dogs/
    - assets/first_meeting/icons/
    - assets/wardrobe/vest/
    - assets/social/google.png
    - assets/social/apple.png
    - assets/social/kakao.png
    - assets/social/naver.png
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    - family: Galmuri11
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
