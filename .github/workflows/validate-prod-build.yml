name: Validate Android signed builds

on:
  push:
    branches: [chore/cicd-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-build-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/chore/cicd-validation'
    environment: signing-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: dev
            keystore: ANDROID_DEV_UPLOAD_KEYSTORE_BASE64
            store_password: ANDROID_DEV_KEYSTORE_PASSWORD
            key_password: ANDROID_DEV_KEY_PASSWORD
          - flavor: prod
            keystore: ANDROID_UPLOAD_KEYSTORE_BASE64
            store_password: ANDROID_KEYSTORE_PASSWORD
            key_password: ANDROID_KEY_PASSWORD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Read pinned Flutter version
        id: sdk
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - name: Select project SDK
        run: |
          dart pub global activate fvm 4.0.1
          fvm use "${{ steps.sdk.outputs.version }}" --force --skip-pub-get
      - name: Check current source
        run: |
          fvm flutter pub get --enforce-lockfile
          fvm dart format --output=none --set-exit-if-changed lib test tool integration_test test_driver
          fvm flutter analyze
          fvm flutter test
      - name: Prepare bundle verifier
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          sdkmanager 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build and verify signed bundle only
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          KEYSTORE_BASE64: ${{ secrets[matrix.keystore] }}
          ANDROID_STORE_PASSWORD: ${{ secrets[matrix.store_password] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[matrix.key_password] }}
          ANDROID_STORE_FILE: ${{ runner.temp }}/android-upload.p12
        run: |
          set +x
          bash tool/verify_android_bundle.sh preflight
          umask 077
          trap 'rm -f "$ANDROID_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_STORE_FILE"
          unset KEYSTORE_BASE64
          if [[ "$FLAVOR" == dev ]]; then
            export BALMATCHUM_DEV_STORE_FILE="$ANDROID_STORE_FILE"
            export BALMATCHUM_DEV_STORE_PASSWORD="$ANDROID_STORE_PASSWORD"
            export BALMATCHUM_DEV_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            export BALMATCHUM_PROD_STORE_FILE="$ANDROID_STORE_FILE"
            export BALMATCHUM_PROD_STORE_PASSWORD="$ANDROID_STORE_PASSWORD"
            export BALMATCHUM_PROD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          fi
          fvm flutter build appbundle --release --flavor "$FLAVOR"
          export BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"
          export LLVM_READELF="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          export ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          export APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          bash tool/verify_android_bundle.sh "build/app/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab" | tee "$RUNNER_TEMP/verification.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}-${{ github.sha }}
          path: |
            build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab
            ${{ runner.temp }}/verification.txt
          if-no-files-found: error
          retention-days: 7
